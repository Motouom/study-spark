<!doctype html>
<html lang="en-CM">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1714" />
    <title>StudySpark is offline</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fbfaf8;
        --foreground: #1b1714;
        --muted: #716b64;
        --border: #e5e0da;
        --card: #fffdf9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        padding: 28px;
        box-shadow: 0 20px 60px rgba(27, 23, 20, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 20px;
      }

      .icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #1b1714;
        display: grid;
        place-items: center;
      }

      .icon svg {
        width: 25px;
        height: 25px;
      }

      h1 {
        margin: 28px 0 10px;
        font-size: clamp(32px, 10vw, 48px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 15px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        min-height: 44px;
        border-radius: 10px;
        padding: 0 16px;
        background: #1b1714;
        color: #fffaf0;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="17" y="14" width="30" height="36" rx="4" stroke="#fff7ed" stroke-width="5" />
            <path d="M25 27h14M25 37h10" stroke="#fff7ed" stroke-width="4" stroke-linecap="round" />
          </svg>
        </span>
        StudySpark
      </div>
      <h1>You are offline.</h1>
      <p>
        StudySpark needs internet access for your private papers, progress, payments, and AI tools.
        Reconnect and try again when your network is stable.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
