  <path class="line" d="M215 285c55-160 275-160 330 0"/>
  <line class="thin dash" x1="120" y1="345" x2="630" y2="95"/>
  <text x="645" y="342">x</text><text x="392" y="82">y</text><text x="523" y="265">y = h(x)</text><text x="510" y="118">y = x</text>
</svg>
