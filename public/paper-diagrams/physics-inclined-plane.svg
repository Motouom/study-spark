<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Forces on an inclined plane</title>
  <desc id="desc">Clean black and white Cameroon GCE style question diagram.</desc>
  <rect width="760" height="420" fill="#fff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#17120f}
